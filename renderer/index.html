<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; img-src 'self' data:" />
  <title>FocusFlow</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="light">
  <div class="titlebar" id="titlebar">
    <div class="titlebar-brand" id="titlebarBrand"></div>
    <div class="titlebar-controls">
      <button class="tb-btn" id="btnMin" title="Minimize" aria-label="Minimize"></button>
      <button class="tb-btn" id="btnMax" title="Maximize" aria-label="Maximize"></button>
      <button class="tb-btn close" id="btnClose" title="Close" aria-label="Close"></button>
    </div>
  </div>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <nav class="side-nav" aria-label="Primary">
        <button class="nav-item" data-view="home" aria-pressed="true" id="navHome"></button>
        <button class="nav-item" data-view="backlog" aria-pressed="false" id="navBacklog"></button>
        <button class="nav-item" data-view="settings" aria-pressed="false" id="navSettings"></button>
      </nav>

      <div class="side-group-head">
        <span class="side-group-title">Groups</span>
        <button class="icon-btn side-group-add" id="groupAdd" title="New group" aria-label="New group"></button>
      </div>
      <form class="side-group-input" id="groupForm" hidden>
        <input id="groupInput" type="text" placeholder="Group name" autocomplete="off" spellcheck="false" />
      </form>
      <div class="side-groups" id="groupList"></div>

      <div class="side-footer">
        <button class="icon-btn theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle theme"></button>
      </div>
    </aside>

    <main class="content" id="content">
      <div class="app" id="app">

        <section class="view" id="view-home">
          <header class="greeting" id="greeting"></header>

          <section class="hero" aria-label="Current task">
            <div class="section-label" id="heroLabel"></div>
            <div id="hero"></div>
          </section>

          <section class="composer" id="composer">
            <form class="composer-row" id="composerForm">
              <div class="composer-input-wrap">
                <input class="composer-input" id="taskTitle" type="text"
                  placeholder="What needs to be done?" autocomplete="off" spellcheck="false" />
              </div>
              <button class="composer-details-toggle" id="detailsToggle" type="button"
                title="Details" aria-label="Toggle task details" aria-expanded="false"></button>
              <button class="composer-submit" type="submit" title="Add task" aria-label="Add task" id="submitBtn"></button>
            </form>
            <div class="composer-details" id="composerDetails">
              <div class="field">
                <div class="field-label">Priority</div>
                <div class="seg" id="prioritySeg" role="group" aria-label="Priority">
                  <button type="button" class="seg-btn" data-value="high">High</button>
                  <button type="button" class="seg-btn" data-value="medium" aria-pressed="true">Medium</button>
                  <button type="button" class="seg-btn" data-value="low">Low</button>
                </div>
              </div>
              <div class="field">
                <div class="field-label">Time-box</div>
                <div class="seg" id="timeboxSeg" role="group" aria-label="Time-box">
                  <button type="button" class="seg-btn" data-value="5">5 min</button>
                  <button type="button" class="seg-btn" data-value="15">15 min</button>
                  <button type="button" class="seg-btn" data-value="30" aria-pressed="true">30 min</button>
                  <button type="button" class="seg-btn" data-value="60">60 min</button>
                </div>
              </div>
              <div class="field">
                <div class="field-label">When &amp; where</div>
                <input class="composer-input-small" id="taskContext" type="text"
                  placeholder="e.g. At my desk, after lunch" autocomplete="off" spellcheck="false" />
              </div>
              <div class="field">
                <div class="field-label">Group</div>
                <select class="composer-input-small" id="taskGroup">
                  <option value="">No group</option>
                </select>
              </div>
            </div>
          </section>
        </section>

        <section class="view" id="view-backlog" hidden>
          <div class="view-head">
            <h1 class="view-title">Backlog</h1>
            <p class="view-sub" id="backlogFilterLabel"></p>
          </div>

          <div class="section-label" id="backlogLabel"></div>
          <div class="backlog-list" id="backlogList"></div>
          <div class="empty-list" id="backlogEmpty" hidden>
            <div class="empty-list-icon" id="backlogEmptyIcon"></div>
            <p>Nothing waiting here.</p>
          </div>

          <div class="section-label" id="doneLabel"></div>
          <div class="done-list" id="doneList"></div>
        </section>

        <section class="view" id="view-settings" hidden>
          <div class="view-head">
            <h1 class="view-title">Settings</h1>
          </div>

          <div class="settings-card">
            <div class="field">
              <div class="field-label">Your name</div>
              <input class="composer-input-small" id="userNameInput" type="text"
                placeholder="e.g. Sarah" autocomplete="off" spellcheck="false" />
              <div class="field-hint">Shown in the greeting.</div>
            </div>

            <div class="field">
              <div class="field-label">Theme</div>
              <div class="seg" id="settingsThemeSeg" role="group" aria-label="Theme">
                <button type="button" class="seg-btn" data-value="light">Light</button>
                <button type="button" class="seg-btn" data-value="dark">Dark</button>
                <button type="button" class="seg-btn" data-value="system">System</button>
              </div>
            </div>

            <div class="settings-danger">
              <button class="btn btn-danger" id="clearDataBtn"></button>
              <div class="field-hint">Removes every task, group and setting.</div>
            </div>
          </div>
        </section>

      </div>

      <footer class="principle" id="principle"></footer>
    </main>
  </div>

  <div class="modal-overlay" id="rescheduleModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h2 class="modal-title" id="modalTitle">Postpone this?</h2>
      <p class="modal-subtitle">No pressure. When works better?</p>
      <div class="option-list" id="rescheduleOptions"></div>
      <div class="reason">
        <div class="field-label">Why? A few honest words.</div>
        <textarea id="reasonInput" placeholder="I am blocked on…, I need a break from it…" spellcheck="false"></textarea>
        <div class="reason-hint" id="reasonHint">A short reason first — this keeps delays honest.</div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modalCancel">Keep it here</button>
        <button class="btn btn-primary" id="modalConfirm" disabled>Move it</button>
      </div>
    </div>
  </div>

  <div class="celebration" id="celebration" aria-hidden="true"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
